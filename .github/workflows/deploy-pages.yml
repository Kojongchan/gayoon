name: Deploy to GitHub Pages

# 슈가맨워크 천호역점 정적 사이트를 GitHub Pages로 배포합니다.
# 이 브랜치에 푸시되면 자동 배포되고, Actions 탭에서 수동 실행도 가능합니다.

on:
  push:
    branches:
      - claude/quirky-turing-e6jzeq
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개만 유지 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true → 저장소에 Pages가 아직 켜져 있지 않으면 자동으로 활성화
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
